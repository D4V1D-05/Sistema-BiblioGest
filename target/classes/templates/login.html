<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Biblioteca - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div class="flex-grow-1 d-flex align-items-center justify-content-center py-4">
    <div class="card shadow-lg border-0 login-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="login-icon mb-3">
            <i class="bi bi-book-half display-5 text-primary"></i>
          </div>
          <h3 class="fw-bold text-dark">BiblioGest</h3>
          <p class="text-muted small">Portal de Administración y Bibliotecarios</p>
        </div>

        <form th:action="@{/}" method="GET">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Usuario o Correo</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" placeholder="usuario" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="contraseña" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/recuperar}" class="text-decoration-none small text-primary">¿Olvidaste tu clave?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
          </button>
        </form>
      </div>
    </div>
  </div>

  <footer class="text-center py-3 text-white-50 small mt-auto">© 2026 Biblioteca Alquiler</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
