<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioGest - Registro de Nuevo Libro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/NuevoLibro.css}" href="/css/NuevoLibro.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: menu}"></div>

  <main class="container my-4 flex-grow-1">

    <div class="bg-white p-4 rounded-3 shadow-sm border-start border-4 border-success mb-4">
      <h2 class="h4 fw-bold text-dark mb-1">
        <i class="bi bi-journal-plus text-success me-2"></i>Registro de Nuevo Libro
      </h2>
      <p class="text-muted mb-0 small">Complete los datos bibliográficos para incorporar un nuevo título al inventario general.</p>
    </div>

    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-header bg-white border-0 pt-4 px-4 pb-0 d-flex align-items-center">
            <span class="badge bg-success-subtle text-success p-2 fs-6 rounded me-2">
              <i class="bi bi-book"></i>
            </span>
            <h5 class="fw-bold mb-0 text-dark fs-6">Ficha Bibliográfica del Nuevo Ejemplar</h5>
          </div>

          <div class="card-body p-4">
            <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="isbn" class="form-label small fw-semibold">Código ISBN / Código de Barras</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-barcode text-muted"></i></span>
                    <input type="text" th:field="*{isbn}" class="form-control" id="isbn" placeholder="Ej: 978-607-00000-0" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="categoria" class="form-label fw-semibold small">Categoría / Género</label>
                  <div class="input-group">
                    <select th:field="*{categoria}" class="form-select" id="categoria" required>
                      <option value="" disabled th:selected="${libro.categoria == null}">Seleccione una categoría</option>
                      <option th:each="cat : ${categorias}" 
                              th:value="${cat.nombre}" 
                              th:text="${cat.nombre}"
                              th:selected="${libro.categoria == cat.nombre}">
                      </option>
                    </select>
                    <button class="btn btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#modalNuevaCategoria">
                      <i class="bi bi-plus-lg"></i> Nueva
                    </button>
                  </div>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-12">
                  <label for="titulo" class="form-label small fw-semibold">Título de la Obra</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-journal-text text-muted"></i></span>
                    <input type="text" th:field="*{titulo}" class="form-control" id="titulo" placeholder="Ej: Clean Code: Manual de desarrollo ágil" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="autor" class="form-label small fw-semibold">Autor(es)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" th:field="*{autor}" class="form-control" id="autor" placeholder="Ej: Robert C. Martin" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="editorial" class="form-label small fw-semibold">Editorial</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-building text-muted"></i></span>
                    <input type="text" th:field="*{editorial}" class="form-control" id="editorial" placeholder="Ej: Prentice Hall / Pearson" required>
                  </div>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Año de Publicación</label>
                  <input type="number" th:field="*{anio}" class="form-control" placeholder="Ej: 2024">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Ubicación / Estante</label>
                  <input type="text" th:field="*{ubicacion}" class="form-control" placeholder="Ej: Estante B - Nivel 3">
                </div>
              </div>

              <hr class="my-4">

              <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
                <a th:href="@{/inventario}" class="btn btn-outline-secondary px-4 py-2">
                  <i class="bi bi-arrow-left me-1"></i> Cancelar
                </a>
                <button type="submit" class="btn btn-success px-4 py-2 fw-semibold">
                  <i class="bi bi-check-circle me-1"></i> Guardar en Inventario
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer class="bg-dark text-light text-center py-3 mt-auto">
    <div class="text-center">
      &copy; 2026 Biblioteca Alquiler
    </div>
  </footer>

  <div class="modal fade" id="modalNuevaCategoria" tabindex="-1" aria-labelledby="modalCatLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fs-6 fw-bold" id="modalCatLabel">
            <i class="bi bi-folder-plus text-primary me-2"></i>Añadir Nueva Categoría
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form th:action="@{/categorias/guardar-rapido}" method="post">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Nombre de la Categoría</label>
              <input type="text" name="nombreCategoria" class="form-control" placeholder="Ej: Inteligencia Artificial" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary btn-sm">
              <i class="bi bi-check-lg me-1"></i> Guardar Categoría
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
