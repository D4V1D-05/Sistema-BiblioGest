<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-book-half text-primary fs-4 me-2"></i> BiblioGest
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">
                    <a class="nav-link active" th:href="@{/}"><i class="bi bi-speedometer2 me-1"></i> Inicio</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-journals me-1"></i> Operaciones
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/prestamos/registrar}">Realizar Préstamos</a></li>
                        <li sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">
                            <a class="dropdown-item" th:href="@{/prestamos/devolucion}">Marcar Devolución</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/prestamos/estado}">Estado</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown" sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-journals me-1"></i> Inventario
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/inventario}">Libros</a></li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item" th:href="@{/libros/nuevo}">Nuevo Libro</a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item" th:href="@{/inventario/ingreso}">Ingreso de Libros</a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">
                    <a class="nav-link" th:href="@{/lectores}"><i class="bi bi-people me-1"></i> Lectores</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/reportes}"><i class="bi bi-bar-chart-line me-1"></i> Métricas & Reportes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/novedades}"><i class="bi bi-megaphone me-1"></i> Novedades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contacto}"><i class="bi bi-envelope me-1"></i> Contacto</a>
                </li>
            </ul>


            <div class="me-3 text-white d-flex align-items-center">
                <i class="bi bi-person-circle me-2 fs-5"></i>
                <span sec:authorize="hasRole('ADMIN')" class="fw-semibold">Administrador</span>
                <span sec:authorize="hasRole('BIBLIOTECARIO')" class="fw-semibold">Bibliotecario</span>
                <span sec:authorize="hasRole('LECTOR')" class="fw-semibold">Lector</span>
            </div>


            <form th:action="@{/logout}" method="post" class="d-flex align-items-center m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
